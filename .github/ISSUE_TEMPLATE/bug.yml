name: Bug
description: Defect, regression or unsafe behavior
title: "[Bug] "
labels:
  - type:bug
  - status:needs-triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: Include capital, accounting, data or operational impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: containment
    attributes:
      label: Production containment
      description: Halt, rollback, exposure and affected run/account scope. Never paste credentials.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Regression acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Sanitized artifacts
      description: Link sanitized logs or run IDs only.
