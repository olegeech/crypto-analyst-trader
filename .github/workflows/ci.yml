name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.3
          cache: npm
      - name: Select validation scope
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_EVENT: ${{ github.event_name }}
        run: node --experimental-strip-types scripts/ci-validation.ts scope
      - name: Check documentation
        if: steps.scope.outputs.docs_only == 'true'
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_DIFF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_DIFF_EVENT: ${{ github.event_name }}
        run: node --experimental-strip-types scripts/ci-validation.ts docs
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm ci
      - if: steps.scope.outputs.docs_only != 'true'
        run: npm run test:release
      - name: Offline CEWS archive replay (no network)
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          python3 scripts/research/cews_inj_external_replication.py \
            --source-dir research/cews/injusdt-2026-08-01_2026-09-30 \
            --start 2026-08-01T00:00:00Z \
            --end 2026-10-01T00:00:00Z \
            --pages-1h 8 --pages-4h 0 --replay
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path("research/cews/injusdt-2026-08-01_2026-09-30/offline-replay-result.json")
          r = json.loads(output.read_text())
          assert r["coverage"]["1h"]["admitted"] == 1464
          assert r["coverage"]["4h"]["admitted"] == 366
          assert (r["overlapping"]["count"], r["overlapping"]["positive"]) == (346, 50)
          assert (r["daily04UTC"]["count"], r["daily04UTC"]["positive"]) == (57, 9)
          assert r["overlapping"]["rules"]["range_shock"] == {
              "TP": 21, "FP": 118, "FN": 29, "TN": 178,
              "precisionPct": r["overlapping"]["rules"]["range_shock"]["precisionPct"],
              "recallPct": r["overlapping"]["rules"]["range_shock"]["recallPct"],
              "falseAlarmPct": r["overlapping"]["rules"]["range_shock"]["falseAlarmPct"],
              "FPRPct": r["overlapping"]["rules"]["range_shock"]["FPRPct"],
              "warningSharePct": r["overlapping"]["rules"]["range_shock"]["warningSharePct"],
          }
          daily = r["daily04UTC"]["rules"]["range_shock"]
          assert tuple(daily[k] for k in ("TP", "FP", "FN", "TN")) == (6, 24, 3, 24)
          assert len(r["sourceFileSha256"]) == 8
          assert r["coverage"]["fourHourSource"].startswith("derived-4h-")
          print("CEWS offline replay assertions passed")
          PY
