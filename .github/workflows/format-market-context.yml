name: Format market context

on:
  push:
    branches:
      - docs/issue-10-market-regime-context

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/issue-10-market-regime-context
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/analytics/market-regime-context.md
      - name: Commit formatting
        run: |
          if git diff --quiet -- docs/analytics/market-regime-context.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/analytics/market-regime-context.md
          git commit -m "style: format market regime context (#10)"
          git push origin HEAD:docs/issue-10-market-regime-context
